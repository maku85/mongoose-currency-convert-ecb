name: Bug Report
description: Report a bug in mongoose-currency-convert-ecb
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.2"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "22.0.0"
    validations:
      required: true

  - type: input
    id: currency-pair
    attributes:
      label: Currency pair
      description: The from/to currencies involved, if applicable.
      placeholder: "USD → EUR"

  - type: input
    id: date
    attributes:
      label: Reference date
      description: The date passed to the rate function, if applicable.
      placeholder: "2024-01-05  /  none (latest rate)"

  - type: dropdown
    id: error-type
    attributes:
      label: Error type
      description: Which error class was thrown, if any.
      options:
        - EcbNetworkError
        - EcbRateNotFoundError
        - EcbInvalidCurrencyError
        - EcbDateOutOfRangeError
        - EcbUnsupportedConversionError
        - No error thrown (wrong value returned)
        - Other / unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code snippet or steps that trigger the bug.
      render: typescript
      placeholder: |
        import { createEcbGetRate } from "mongoose-currency-convert-ecb";

        const getRate = createEcbGetRate();
        const rate = await getRate("USD", "EUR", new Date("2024-01-05"));
        // ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The rate for USD → EUR on 2024-01-05 should be approximately 0.92.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and stack trace if available.
      placeholder: |
        EcbRateNotFoundError: Missing rate for USD on 2024-01-05
            at fetchBceRate (...)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other relevant details (proxy/firewall, ECB API response, etc.).
